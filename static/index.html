<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-benchmark</title>
<style>
  :root {
    --bg: #fff; --fg: #111; --muted: #6b7280; --line: #e5e7eb; --soft: #f6f7f9;
    --ok: #16a34a; --err: #dc2626; --run: #2563eb; --accent: #111;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --fg: #e5e7eb; --muted: #9ca3af; --line: #262a33; --soft: #171a21; --accent: #e5e7eb; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header a { color: var(--muted); cursor: pointer; text-decoration: none; }
  header a.active { color: var(--fg); }
  main { padding: 16px 20px; max-width: 1800px; }
  textarea, input, select { font: inherit; color: inherit; background: var(--soft);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  textarea { width: 100%; min-height: 90px; resize: vertical; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .row label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .row input[type=number] { width: 80px; }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--accent);
           background: var(--accent); color: var(--bg); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--fg); border-color: var(--line); padding: 4px 10px; }
  .models { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
  .models fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; min-width: 160px; }
  .models legend { color: var(--muted); padding: 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .models label { display: block; white-space: nowrap; }
  .models label.nokey { color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); }
  #grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); margin-top: 20px; }
  .card { border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-height: 200px; overflow: hidden; }
  .card .head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--soft); border-bottom: 1px solid var(--line); }
  .card .name { font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .pill.run { color: var(--run); } .pill.ok { color: var(--ok); } .pill.error { color: var(--err); }
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 8px; padding: 8px 12px;
             border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .metrics div { font-size: 12px; } .metrics b { display: block; font-weight: 500; }
  .metrics span { color: var(--muted); font-size: 11px; }
  .body { padding: 10px 12px; flex: 1; overflow: auto; max-height: 520px; }
  .body pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .body details { margin-bottom: 8px; } .body details pre { color: var(--muted); font-size: 12px; }
  .errmsg { color: var(--err); white-space: pre-wrap; font-size: 13px; }
  .foot { display: flex; gap: 4px; padding: 8px 12px; border-top: 1px solid var(--line); align-items: center; }
  .foot .stars button { background: transparent; border: none; color: var(--muted); padding: 2px 4px; font-size: 16px; }
  .foot .stars button.on { color: #f59e0b; }
  .foot .muted { margin-left: auto; color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; }
  .muted { color: var(--muted); }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.click { cursor: pointer; } tr.click:hover { background: var(--soft); }
  td.prompt { max-width: 600px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>ai-benchmark</h1>
  <a id="nav-bench" class="active">bench</a>
  <a id="nav-history">history</a>
  <span id="status" class="muted" style="margin-left:auto"></span>
</header>

<main id="bench">
  <textarea id="prompt" placeholder="Prompt…"></textarea>
  <details style="margin-top:8px"><summary>system prompt</summary>
    <textarea id="system" style="min-height:60px;margin-top:6px" placeholder="(optional)"></textarea>
  </details>
  <div class="models" id="models"></div>
  <div class="row">
    <label>max_tokens <input type="number" id="max_tokens" value="1024" min="1"></label>
    <label>temperature <input type="number" id="temperature" step="0.1" min="0" max="2" placeholder="default"></label>
    <label>repeat <input type="number" id="repeat" value="1" min="1" max="10"></label>
    <label>timeout s <input type="number" id="timeout" value="180" min="5"></label>
    <button id="run">Run</button>
  </div>
  <div id="grid"></div>
</main>

<main id="history" class="hidden">
  <table>
    <thead><tr><th>#</th><th>when</th><th>prompt</th><th>models</th><th>errors</th><th></th></tr></thead>
    <tbody id="runs"></tbody>
  </table>
</main>

<script>
const $ = s => document.querySelector(s);
const fmt = (v, d=0) => v == null ? '–' : Number(v).toFixed(d);
const ms = v => v == null ? '–' : v < 1000 ? `${fmt(v)} ms` : `${fmt(v/1000, 2)} s`;
const esc = s => (s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const key = (m, r) => `${m}#${r}`;
let cards = {};

// ---- models ----
async function loadModels() {
  const models = await (await fetch('/api/models')).json();
  const byProv = {};
  for (const m of models) (byProv[m.provider] ||= []).push(m);
  const saved = new Set(JSON.parse(localStorage.getItem('sel') || '[]'));
  $('#models').innerHTML = Object.entries(byProv).map(([p, ms]) => `
    <fieldset><legend>${p}</legend>${ms.map(m => `
      <label class="${m.has_key ? '' : 'nokey'}" title="${m.model}">
        <input type="checkbox" value="${m.id}" ${m.has_key ? '' : 'disabled'} ${saved.has(m.id) ? 'checked' : ''}>
        ${m.id}${m.has_key ? '' : ' <small>(no key)</small>'}</label>`).join('')}
    </fieldset>`).join('');
}
const selected = () => [...document.querySelectorAll('#models input:checked')].map(i => i.value);

// ---- cards ----
function card(model_id, rep, repeat) {
  const k = key(model_id, rep);
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="head"><span class="name">${esc(model_id)}${repeat > 1 ? ` <span class="muted">#${rep+1}</span>` : ''}</span>
      <span class="pill run">running</span></div>
    <div class="metrics">
      <div><b class="ttft">–</b><span>TTFT</span></div>
      <div><b class="total">–</b><span>total</span></div>
      <div><b class="tps">–</b><span>tok/s</span></div>
      <div><b class="tokens">–</b><span>out tokens</span></div>
    </div>
    <div class="body">
      <details class="reasoning hidden"><summary>reasoning</summary><pre></pre></details>
      <pre class="content"></pre>
      <div class="errmsg hidden"></div>
    </div>
    <div class="foot hidden"><span class="stars"></span><span class="muted meta"></span></div>`;
  $('#grid').appendChild(el);
  cards[k] = { el, content: '', reasoning: '' };
  return cards[k];
}

function applyDelta(ev) {
  const c = cards[key(ev.model_id, ev.rep)]; if (!c) return;
  if (ev.reasoning) {
    c.reasoning += ev.reasoning;
    const d = c.el.querySelector('.reasoning'); d.classList.remove('hidden');
    d.querySelector('pre').textContent = c.reasoning;
  }
  if (ev.content) { c.content += ev.content; c.el.querySelector('.content').textContent = c.content; }
}

function applyResult(r) {
  const c = cards[key(r.model_id, r.rep)]; if (!c) return;
  const q = s => c.el.querySelector(s);
  const pill = q('.pill'); pill.className = `pill ${r.status}`; pill.textContent = r.status === 'ok' ? (r.finish_reason || 'ok') : 'error'; pill.title = r.error || '';
  q('.ttft').textContent = ms(r.ttft_ms);
  q('.total').textContent = ms(r.total_ms);
  q('.tps').textContent = fmt(r.tokens_per_s, 1);
  q('.tokens').textContent = r.completion_tokens == null ? '–'
    : `${r.completion_tokens}${r.tokens_estimated ? '~' : ''}${r.reasoning_tokens ? ` (${r.reasoning_tokens} think)` : ''}`;
  if (r.content != null) { c.content = r.content; q('.content').textContent = r.content; }
  if (r.reasoning) { c.reasoning = r.reasoning; q('.reasoning').classList.remove('hidden'); q('.reasoning pre').textContent = r.reasoning; }
  if (r.error) { const e = q('.errmsg'); e.classList.remove('hidden'); e.textContent = r.error; }
  const foot = q('.foot'); foot.classList.remove('hidden');
  foot.querySelector('.meta').textContent = [r.http_status && `HTTP ${r.http_status}`, r.prompt_tokens != null && `in ${r.prompt_tokens}`,
    r.http_status === 200 && !r.stream_complete ? 'no [DONE]' : null, r.request_id].filter(Boolean).join(' · ');
  const stars = foot.querySelector('.stars');
  const paint = v => { stars.innerHTML = [1,2,3,4,5].map(i => `<button class="${i <= (v||0) ? 'on' : ''}" data-v="${i}">★</button>`).join(''); };
  paint(r.rating);
  stars.onclick = async e => {
    const v = +e.target.dataset.v; if (!v) return;
    const nv = v === r.rating ? null : v; r.rating = nv; paint(nv);
    await fetch(`/api/results/${r.id}/rating`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ rating: nv }) });
  };
}

// ---- run ----
async function run() {
  const model_ids = selected();
  if (!model_ids.length) return alert('pick at least one model');
  const prompt = $('#prompt').value.trim(); if (!prompt) return alert('prompt is empty');
  localStorage.setItem('sel', JSON.stringify(model_ids));
  const repeat = +$('#repeat').value || 1;
  const temp = $('#temperature').value;
  const body = { prompt, system: $('#system').value.trim() || null, model_ids, repeat,
    max_tokens: +$('#max_tokens').value || 1024, temperature: temp === '' ? null : +temp, timeout_s: +$('#timeout').value || 180 };

  $('#grid').innerHTML = ''; cards = {};
  for (let rep = 0; rep < repeat; rep++) for (const m of model_ids) card(m, rep, repeat);
  $('#run').disabled = true; $('#status').textContent = 'running…';

  const resp = await fetch('/api/run', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  if (!resp.ok) { $('#status').textContent = `error ${resp.status}: ${await resp.text()}`; $('#run').disabled = false; return; }
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
      if (!line.startsWith('data:')) continue;
      const ev = JSON.parse(line.slice(5));
      if (ev.type === 'delta') applyDelta(ev);
      else if (ev.type === 'result') applyResult(ev.result);
      else if (ev.type === 'run') $('#status').textContent = `run #${ev.run_id} running…`;
      else if (ev.type === 'done') $('#status').textContent = `run #${ev.run_id} done`;
    }
  }
  $('#run').disabled = false;
}

// ---- history ----
async function showHistory() {
  const runs = await (await fetch('/api/runs')).json();
  $('#runs').innerHTML = runs.map(r => `
    <tr class="click" data-id="${r.id}"><td>${r.id}</td><td class="muted">${r.created_at.replace('T',' ').slice(0,16)}</td>
      <td class="prompt" title="${esc(r.prompt)}">${esc(r.prompt)}</td><td>${r.n}</td>
      <td>${r.errors ? `<span class="pill error">${r.errors}</span>` : ''}</td>
      <td><button class="ghost del" data-id="${r.id}">✕</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">no runs yet</td></tr>';
}
async function openRun(id) {
  const r = await (await fetch(`/api/runs/${id}`)).json();
  nav('bench');
  $('#prompt').value = r.prompt; $('#system').value = r.system || '';
  $('#max_tokens').value = r.params.max_tokens; $('#temperature').value = r.params.temperature ?? ''; $('#repeat').value = r.params.repeat;
  $('#grid').innerHTML = ''; cards = {};
  for (const x of r.results) { card(x.model_id, x.rep, r.params.repeat); applyResult(x); }
  $('#status').textContent = `run #${r.id} (${r.created_at.replace('T',' ').slice(0,16)})`;
}
function nav(which) {
  $('#bench').classList.toggle('hidden', which !== 'bench');
  $('#history').classList.toggle('hidden', which !== 'history');
  $('#nav-bench').classList.toggle('active', which === 'bench');
  $('#nav-history').classList.toggle('active', which === 'history');
  if (which === 'history') showHistory();
}

$('#run').onclick = run;
$('#prompt').addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') run(); });
$('#nav-bench').onclick = () => nav('bench');
$('#nav-history').onclick = () => nav('history');
$('#runs').onclick = async e => {
  const del = e.target.closest('.del');
  if (del) { if (confirm(`delete run #${del.dataset.id}?`)) { await fetch(`/api/runs/${del.dataset.id}`, { method: 'DELETE' }); showHistory(); } return; }
  const tr = e.target.closest('tr.click'); if (tr) openRun(tr.dataset.id);
};
loadModels();
</script>
</body>
</html>

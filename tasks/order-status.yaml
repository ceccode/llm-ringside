# Chained calls: the second call needs a value returned by the first.
id: order-status
prompt: What's the status of the most recent order placed by mario.rossi@example.com?
max_steps: 6
tools:
  - name: find_customer
    description: Look up a customer by email address. Returns the customer id.
    parameters:
      type: object
      properties:
        email: {type: string, description: Customer email address}
      required: [email]
    responses:
      - when: {email: mario.rossi@example.com}
        return: {customer_id: C-42, name: Mario Rossi}
      - return: {error: customer not found}
  - name: get_orders
    description: List all orders of a customer, oldest first.
    parameters:
      type: object
      properties:
        customer_id: {type: string}
      required: [customer_id]
    responses:
      - when: {customer_id: C-42}
        return:
          - {order_id: O-1001, date: "2026-10-02", status: delivered}
          - {order_id: O-1017, date: "2026-11-03", status: shipped}
      - return: {error: unknown customer_id}
  - name: get_invoice
    description: Get the invoice PDF link for an order.
    parameters:
      type: object
      properties:
        order_id: {type: string}
      required: [order_id]
    responses:
      - return: {url: "https://example.com/invoices/O-1017.pdf"}
expect:
  ordered: true
  calls:
    - {name: find_customer, args: {email: mario.rossi@example.com}}
    - {name: get_orders, args: {customer_id: C-42}}
  final_contains: [O-1017, shipped]
